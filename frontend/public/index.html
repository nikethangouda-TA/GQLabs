<script>
// === AUDIO CHAOS SYSTEM - Added per user request ===
(function(){
  let ctx=null, isOn=true, disco=null, isDisco=false, clicks=0;
  function init(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); }
  function tone(f,type='sine',d=0.15,v=0.3){
    if(!isOn||!ctx) return;
    try{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(v, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+d);
      o.start(); o.stop(ctx.currentTime+d);
    }catch(e){}
  }
  const playHover=()=>tone(650+Math.random()*200,'sine',0.07,0.12);
  const playClick=()=>{ tone(900,'sine',0.08,0.22); setTimeout(()=>tone(400,'sine',0.12,0.22),70); };
  const playPop=()=>tone(1300,'sine',0.1,0.32);
  const playScream=()=>{ 
    if(!isOn||!ctx) return;
    try{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(180,ctx.currentTime); o.frequency.linearRampToValueAtTime(1100,ctx.currentTime+0.6);
      o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.22,ctx.currentTime); g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.6);
      o.start(); o.stop(ctx.currentTime+0.6);
    }catch(e){}
  };
  const playWin=()=>{ [261,329,392,523].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.35,0.28),i*110)); };
  const playKick=()=>tone(55,'sine',0.25,0.5);
  const playHat=()=>{
    if(!isOn||!ctx) return;
    try{
      const size=ctx.sampleRate*0.04; const buf=ctx.createBuffer(1,size,ctx.sampleRate); const d=buf.getChannelData(0);
      for(let i=0;i<size;i++) d[i]=(Math.random()*2-1)*0.2;
      const s=ctx.createBufferSource(); s.buffer=buf; const g=ctx.createGain(); g.gain.value=0.12; s.connect(g); g.connect(ctx.destination); s.start();
    }catch(e){}
  };

  // Create audio toggle + contact bar
  window.addEventListener('DOMContentLoaded', ()=>{
    // Add top contact/audio bar
    const topBar = document.createElement('div');
    topBar.innerHTML = `
      <div id="audioContactBar" style="position:fixed; top:12px; right:12px; z-index:99999; display:flex; gap:8px; align-items:center;">
        <a href="https://instagram.com/nikethangouda" target="_blank" style="background:white; border:2.5px solid black; border-radius:999px; padding:6px 14px; font-family:Geist, sans-serif; font-weight:800; font-size:12px; box-shadow:3px 3px 0 black; text-decoration:none; color:black; display:flex; align-items:center; gap:6px;">
          📸 @nikethangouda
        </a>
      </div>
      <div id="contactFooter" style="position:fixed; bottom:12px; left:12px; z-index:99999; display:flex; gap:8px; flex-wrap:wrap;">
        <a href="https://wa.me/919032247068" target="_blank" style="background:#25D366; border:2.5px solid black; border-radius:999px; padding:6px 14px; font-weight:900; font-size:12px; box-shadow:3px 3px 0 black; text-decoration:none; color:black; display:flex; align-items:center; gap:6px;">💬 WhatsApp</a>
        <a href="mailto:nikethan@glidequantumlabs.com" style="background:white; border:2.5px solid black; border-radius:999px; padding:6px 14px; font-weight:800; font-size:12px; box-shadow:3px 3px 0 black; text-decoration:none; color:black;">✉️ nikethan@glidequantumlabs.com</a>
      </div>
      <div id="viz" style="position:fixed; bottom:0; left:0; right:0; height:36px; display:flex; align-items:end; justify-content:center; gap:3px; opacity:0; pointer-events:none; transition:0.3s; z-index:9998; padding:0 10px;"></div>
    `;
    document.body.appendChild(topBar);

    const viz = document.getElementById('viz');
    for(let i=0;i<20;i++){ const b=document.createElement('div'); b.style.width='6px'; b.style.height='6px'; b.style.background='#FFD60A'; b.style.border='1px solid black'; b.style.borderRadius='999px'; b.style.transition='height 0.08s'; viz.appendChild(b); }

    // Sound is always ON logically. Browsers still require a user gesture before
    // Web Audio can actually output sound, so initialize on the first interaction.
    const activateAudio = ()=>{ init(); viz.style.opacity='1'; };
    document.addEventListener('pointerdown', activateAudio, {once:true, passive:true});
    document.addEventListener('keydown', activateAudio, {once:true, passive:true});

    // Hover sounds
    document.body.addEventListener('mouseover', (e)=>{
      const t = e.target.closest('button, a, [class*="rounded"]');
      if(t && isOn && Math.random()>0.3) playHover();
    });

    // Click sounds
    document.body.addEventListener('click', (e)=>{
      const t = e.target.closest('button, a');
      if(t){
        init();
        if(isOn) playClick();
        // special scream for main chaos button
        if(t.textContent && t.textContent.toLowerCase().includes('chaos')) playScream();
      }
    });

    // Pop sound for bubbles. Start observing only after the first interaction;
    // this keeps startup free of a document-wide MutationObserver.
    let observer=null;
    const startObserver=()=>{
      if(observer) return;
      observer = new MutationObserver((mutations)=>{
        mutations.forEach(m=>{
          m.removedNodes.forEach(n=>{
            if(n.nodeType===1 && isOn) playPop();
          });
        });
      });
      observer.observe(document.body, {childList:true, subtree:true});
    };
    document.addEventListener('pointerdown', startObserver, {once:true, passive:true});
    document.addEventListener('keydown', startObserver, {once:true, passive:true});

    // Logo disco - find logo element (NIKETHAN.LOL or N)
    let logoEl = document.querySelector('header') || document.body;
    logoEl.addEventListener('click', (e)=>{
      const isLogo = e.target.textContent && (e.target.textContent.includes('NIKETHAN') || e.target.textContent.includes('N') && e.target.closest('header'));
      if(!isLogo && !e.target.closest('header')) return;
      init(); clicks++; 
      if(isOn) playPop();
      if(clicks>=5){
        clicks=0; isDisco=true;
        let hue=0;
        if(disco) clearInterval(disco);
        disco=setInterval(()=>{
          hue=(hue+14)%360;
          document.body.style.filter=`hue-rotate(${hue}deg)`;
          if(isOn){ Math.random()>0.45?playKick():playHat(); 
            viz.querySelectorAll('div').forEach(el=>el.style.height=(8+Math.random()*28)+'px');
          }
        },110);
        if(isOn) playWin();
        viz.style.opacity='1';
        setTimeout(()=>{ clearInterval(disco); disco=null; isDisco=false; document.body.style.filter=''; },7000);
      }
    });

    // Typewriter sound on inputs
    document.body.addEventListener('keydown', (e)=>{
      if(e.target.tagName==='INPUT' && isOn && Math.random()>0.5){
        tone(280+Math.random()*100,'square',0.04,0.08);
      }
    });

    // Chaos bar win — only check while the page is visible.
    let lastChaos=0, chaosTimer=null;
    const startChaosCheck=()=>{
      if(chaosTimer) return;
      chaosTimer=setInterval(()=>{
        if(document.hidden) return;
        const pct = window.scrollY/(document.body.scrollHeight-innerHeight)*100;
        if(pct>98 && lastChaos<98 && isOn){ playWin(); lastChaos=100; }
        if(pct<50) lastChaos=pct;
      },800);
    };
    document.addEventListener('pointerdown', startChaosCheck, {once:true, passive:true});
    document.addEventListener('keydown', startChaosCheck, {once:true, passive:true});
  });
})();
</script>
